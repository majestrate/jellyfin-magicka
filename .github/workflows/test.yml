name: test

on:
  push:
    branches:
      - dev
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "26.0.2"
          rebar3-version: "3"
          elixir-version: "1.15.4"
      - run: mix deps.get
      - run: mix test
